name: Publish PDFs

on:
  push:
    branches: [main]
    paths:
      - '**/main.pdf'
      - '.github/workflows/publish-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare PDFs
        shell: bash
        run: |
          mkdir -p _site
          printf '<!doctype html><html lang="ko"><meta charset="utf-8"><title>KGUPC Archive</title><h1>KGUPC Archive</h1><ul>\n' > _site/index.html
          for contest in [0-9]*/; do
            for section in problems solutions; do
              pdf="${contest}${section}/main.pdf"
              if [ -f "$pdf" ]; then
                mkdir -p "_site/${contest}${section}"
                cp "$pdf" "_site/$pdf"
                printf '<li><a href="%s">%s %s</a></li>\n' "$pdf" "${contest%/}" "$section" >> _site/index.html
              fi
            done
          done
          printf '</ul></html>\n' >> _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
