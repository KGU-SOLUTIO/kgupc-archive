name: Publish PDFs

on:
  push:
    branches: [main]
    paths:
      - '**/main.pdf'
      - 'scripts/prepare_pages.py'
      - '.github/workflows/publish-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare PDFs
        run: python3 scripts/prepare_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
